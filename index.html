<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Portal</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- LOGIN PAGE -->
  <div id="page-login" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
      <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Portal Login</h2>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium">Username</label>
          <input type="text" id="loginUser" class="w-full border p-2 rounded mt-1" required>
        </div>
        <div>
          <label class="block text-sm font-medium">Password</label>
          <input type="password" id="loginPass" class="w-full border p-2 rounded mt-1" required>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Sign In</button>
      </form>
    </div>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="page-admin" class="hidden min-h-screen flex flex-col md:flex-row">
    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-slate-800 text-white p-4">
      <h1 class="text-xl font-bold mb-6">Admin Panel</h1>
      <nav class="space-y-2">
        <button onclick="switchAdminSubpage('home')" class="block w-full text-left p-2 rounded hover:bg-slate-700">Home</button>
        <button onclick="switchAdminSubpage('announcement')" class="block w-full text-left p-2 rounded hover:bg-slate-700">Announcement</button>
        <button onclick="switchAdminSubpage('soloparent')" class="block w-full text-left p-2 rounded hover:bg-slate-700">Solo Parents Data</button>
        <button onclick="switchAdminSubpage('pwd')" class="block w-full text-left p-2 rounded hover:bg-slate-700">PWD Data</button>
        <button onclick="switchAdminSubpage('senior')" class="block w-full text-left p-2 rounded hover:bg-slate-700">Senior Citizens Data</button>
      </nav>
      <button onclick="logout()" class="mt-8 text-red-400 hover:underline">Logout</button>
    </aside>
    <!-- Content Area -->
    <main class="flex-1 p-6">
      <div id="admin-sub-home">
        <h2 class="text-2xl font-bold">Admin Overview</h2>
        <p class="mt-2 text-gray-600">Select an option from the sidebar to manage system data.</p>
      </div>
      <div id="admin-sub-announcement" class="hidden">
        <h2 class="text-2xl font-bold mb-4">Manage Announcements</h2>
        <form id="announcementForm" class="bg-white p-4 rounded shadow space-y-4 max-w-lg">
          <input type="text" id="annTitle" placeholder="Title" class="w-full border p-2 rounded" required>
          <textarea id="annContent" placeholder="Content" class="w-full border p-2 rounded" required></textarea>
          <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Post Announcement</button>
        </form>
      </div>
      <div id="admin-sub-soloparent" class="hidden">
        <h2 class="text-2xl font-bold mb-4">Solo Parents Records</h2>
        <div id="data-soloparent-table" class="bg-white p-4 rounded shadow overflow-x-auto">Loading...</div>
      </div>
      <div id="admin-sub-pwd" class="hidden">
        <h2 class="text-2xl font-bold mb-4">PWD Records</h2>
        <div id="data-pwd-table" class="bg-white p-4 rounded shadow overflow-x-auto">Loading...</div>
      </div>
      <div id="admin-sub-senior" class="hidden">
        <h2 class="text-2xl font-bold mb-4">Senior Citizens Records</h2>
        <div id="data-senior-table" class="bg-white p-4 rounded shadow overflow-x-auto">Loading...</div>
      </div>
    </main>
  </div>

  <!-- CLIENT DASHBOARD -->
  <div id="page-client" class="hidden min-h-screen flex flex-col md:flex-row">
    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-blue-900 text-white p-4">
      <h1 class="text-xl font-bold mb-6">Client Portal</h1>
      <nav class="space-y-2">
        <button onclick="switchClientSubpage('home')" class="block w-full text-left p-2 rounded hover:bg-blue-800">Home</button>
        <button onclick="switchClientSubpage('form')" class="block w-full text-left p-2 rounded hover:bg-blue-800">Application Form</button>
      </nav>
      <button onclick="logout()" class="mt-8 text-red-300 hover:underline">Logout</button>
    </aside>
    <!-- Content Area -->
    <main class="flex-1 p-6">
      <div id="client-sub-home">
        <h2 class="text-2xl font-bold mb-4">Announcements</h2>
        <div id="client-announcements-list" class="space-y-4">Loading announcements...</div>
      </div>
      <div id="client-sub-form" class="hidden">
        <h2 id="client-form-title" class="text-2xl font-bold mb-4">Application Form</h2>
        <form id="dynamicClientForm" class="bg-white p-6 rounded shadow max-w-lg space-y-4">
          <!-- Dynamic Form Inputs Inserted Via JS -->
        </form>
      </div>
    </main>
  </div>

  <script>
    const API_URL = "YOUR_DEPLOYED_GOOGLE_APPS_SCRIPT_WEB_APP_URL";
    let currentUser = null;

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // Login Handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUser').value;
      const password = document.getElementById('loginPass').value;

      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', username, password })
      });
      const data = await res.json();

      if (data.success) {
        currentUser = data.user;
        routeUser(data.user);
      } else {
        alert(data.message);
      }
    });

    // Routing Logic
    function routeUser(user) {
      document.getElementById('page-login').classList.add('hidden');
      if (user.role === 'Admin') {
        document.getElementById('page-admin').classList.remove('hidden');
        switchAdminSubpage('home');
      } else if (user.role === 'Client') {
        document.getElementById('page-client').classList.remove('hidden');
        switchClientSubpage('home');
        loadAnnouncements();
        renderClientForm(user.clientType);
      }
    }

    // Admin Subpage Routing
    function switchAdminSubpage(tab) {
      ['home', 'announcement', 'soloparent', 'pwd', 'senior'].forEach(t => {
        document.getElementById(`admin-sub-${t}`).classList.add('hidden');
      });
      document.getElementById(`admin-sub-${tab}`).classList.remove('hidden');

      if (['soloparent', 'pwd', 'senior'].includes(tab)) {
        loadAdminTableData(tab);
      }
    }

    // Client Subpage Routing
    function switchClientSubpage(tab) {
      document.getElementById('client-sub-home').classList.add('hidden');
      document.getElementById('client-sub-form').classList.add('hidden');
      document.getElementById(`client-sub-${tab}`).classList.remove('hidden');
    }

    // Dynamic Form Rendering Based on Client Type
    function renderClientForm(type) {
      const form = document.getElementById('dynamicClientForm');
      document.getElementById('client-form-title').innerText = `${type} Registration Form`;

      let targetTab = "SoloParent";
      if (type === "PWD") targetTab = "PWD";
      if (type === "Senior Citizen") targetTab = "SeniorCitizen";

      form.innerHTML = `
        <input type="hidden" name="tabName" value="${targetTab}">
        <div>
          <label class="block text-sm font-medium">Full Name</label>
          <input type="text" name="fullName" class="w-full border p-2 rounded mt-1" required>
        </div>
        <div>
          <label class="block text-sm font-medium">Contact Number</label>
          <input type="text" name="contact" class="w-full border p-2 rounded mt-1" required>
        </div>
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Submit Registration</button>
      `;

      form.onsubmit = async (e) => {
        e.preventDefault();
        const formData = {
          username: currentUser.username,
          fullName: form.fullName.value,
          contact: form.contact.value
        };

        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'submitForm', tabName: targetTab, formData })
        });
        const result = await res.json();
        alert(result.message);
      };
    }

    // Fetch Announcements
    async function loadAnnouncements() {
      const res = await fetch(`${API_URL}?action=getAnnouncements`);
      const data = await res.json();
      const container = document.getElementById('client-announcements-list');
      container.innerHTML = data.map(item => `
        <div class="bg-white p-4 rounded shadow">
          <h3 class="font-bold text-lg">${item.Title}</h3>
          <p class="text-xs text-gray-500 mb-2">${item.Date}</p>
          <p class="text-gray-700">${item.Content}</p>
        </div>
      `).join('');
    }

    // Fetch Table Data for Admin
    async function loadAdminTableData(type) {
      const tabMap = { soloparent: 'SoloParent', pwd: 'PWD', senior: 'SeniorCitizen' };
      const res = await fetch(`${API_URL}?action=getData&tabName=${tabMap[type]}`);
      const data = await res.json();
      const container = document.getElementById(`data-${type}-table`);

      if (!data.length) {
        container.innerHTML = "<p>No data found.</p>";
        return;
      }

      const headers = Object.keys(data[0]);
      let html = `<table class="w-full text-left border-collapse"><thead><tr>`;
      headers.forEach(h => html += `<th class="border-b p-2 font-semibold">${h}</th>`);
      html += `</tr></thead><tbody>`;
      data.forEach(row => {
        html += `<tr>`;
        headers.forEach(h => html += `<td class="border-b p-2">${row[h]}</td>`);
        html += `</tr>`;
      });
      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    function logout() {
      currentUser = null;
      document.getElementById('page-admin').classList.add('hidden');
      document.getElementById('page-client').classList.add('hidden');
      document.getElementById('page-login').classList.remove('hidden');
    }
  </script>
</body>
</html>
